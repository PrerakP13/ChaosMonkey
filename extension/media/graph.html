<!DOCTYPE html>
<html lang="en">
<head><title>Chaos Graph</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      font-family: sans-serif;
    }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
    }

    button {
      margin-right: 8px;
      padding: 6px 12px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #container {
      display: flex;
      height: 100%;
    }

    #cy {
      flex: 3;
      background: #1e1e1e;
    }

    #analysis-panel {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #252526;
      color: #ddd;
      border-left: 1px solid #333;
      font-size: 12px;
    }

    #report-status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(37, 37, 38, 0.96);
      color: #ddd;
      border: 1px solid #444;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    #report-status.loading {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #report-status .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #8ab4f8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }


  </style>
</head>

<body>

  <div id="controls">
    <button id="simulateBtn">Simulate</button>
    <button id="analyzeBtn">Analyze</button>
  </div>

  <div id="container">
    <div id="cy"></div>
    <div id="analysis-panel"></div>
  </div>
  <div id="report-status" role="status" aria-live="polite" style="display:none"></div>
    



  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <script src="${graphJsUri}"></script>

</body>
</html>
